spring.application.name=appzys-web-backend
server.port=8080
spring.config.import=optional:classpath:application-local.properties

# MySQL 8 Configuration (uses local-only file locally, env vars on Render)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appzys_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# CORS allowed origins (Vite Dev + Render + Production Domain)
appzys.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://appzys.com,https://www.appzys.com}
appzys.site.base-url=${SITE_BASE_URL:https://appzys.com}
appzys.notify.email=${APPZYS_NOTIFY_EMAIL:}

# Optional SMTP Alerts (set MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD env vars to enable)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
